# Fly.io 배포 설정.
#
# 지연이 승패를 가르는 게임이라 **리전 선택이 가장 중요하다.**
# 팀이 한국에 있으면 나리타(nrt)가 가장 가깝다. 멀리 두면 조작이 굼떠진다.
app = "gojijeon"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  # 이게 없으면 시작 배너가 컨테이너 내부 IP(172.19.x.x)를 찍는다.
  # 로그를 보는 사람에게 아무 쓸모가 없는 주소다.
  PUBLIC_URL = "https://gojijeon.fly.dev"

# ⚠️ 반드시 머신 **한 대**로 띄운다.
#
# 방이 메모리에 있다. 두 대가 뜨면 접속이 분산되면서 **같은 코드를 친 사람이
# 서로 다른 머신의 다른 방에 들어간다.** 서로 영영 못 만난다.
#
# Fly는 첫 배포에서 고가용성 명목으로 두 번째 머신을 자동으로 띄운다.
# 이 파일만으로는 막을 수 없고 배포 명령에 --ha=false 를 줘야 한다.
# 그래서 `npm run deploy`에 그 플래그를 박아 두었다 — 맨손으로 `fly deploy`를
# 치면 다시 두 대가 된다.
#
# 여러 대가 정말 필요해지면 방 상태를 Redis 같은 곳으로 빼야 한다.

[http_service]
  internal_port = 8080
  force_https = true
  # 자면 진행 중인 판이 사라진다. 재우지 않는다.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  # 20Hz 틱 × 방 몇 개면 이 정도로 충분하다. 모자라면 cpus를 올린다.
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
