<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>고지전</title>
    <style>
      /* 게임 화면은 캔버스 하나, 그 위에 DOM 오버레이(#ui) 한 겹.
         텍스트는 캔버스보다 DOM이 훨씬 선명해서 HUD는 전부 DOM으로 그린다. */
      :root {
        --bg: #0b0d12;
        --panel: rgba(16, 20, 28, 0.86);
        --panel-solid: #12161f;
        --line: rgba(255, 255, 255, 0.12);
        --text: #e5e7eb;
        --muted: #9aa3b2;
        --accent: #4fd1c5;
        --danger: #f87171;
        --ok: #a3e635;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--text);
        font: 13px/1.4 "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      /* 오버레이는 기본적으로 클릭을 통과시킨다. 조작 가능한 조각만 되살린다. */
      #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; }
      #ui button, #ui input, #ui select, #ui .clickable { pointer-events: auto; }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      .corner { position: absolute; padding: 10px 12px; }
      .tl { top: 12px; left: 12px; }
      .bl { bottom: 12px; left: 12px; }
      .tc { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
      .bc { bottom: 12px; left: 50%; transform: translateX(-50%); }
      .tr { top: 12px; right: 12px; }

      .hidden { display: none !important; }
      /* 전투 시작 알림. 화면을 가리되 조작은 통과시킨다(#ui가 이미 통과시킨다). */
      .announce {
        position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; white-space: nowrap; will-change: opacity, transform;
      }
      .announce-title {
        font-size: 56px; font-weight: 800; letter-spacing: 3px; color: #fff;
        text-shadow: 0 0 18px rgba(251,191,36,.65), 0 3px 10px rgba(0,0,0,.9);
      }
      .announce-sub { font-size: 20px; font-weight: 600; color: #fbbf24; margin-top: 6px; }
      .muted { color: var(--muted); }
      .mono { font-variant-numeric: tabular-nums; }

      .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--ok); transition: width .12s linear; }

      button {
        font: inherit; color: var(--text); cursor: pointer;
        background: #1c2230; border: 1px solid var(--line);
        border-radius: 6px; padding: 7px 14px;
      }
      button:hover { background: #26303f; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.primary { background: #1f6f68; border-color: #2c9a90; }
      button.primary:hover { background: #24837a; }
      input[type="text"] {
        font: inherit; color: var(--text); background: #0f131b;
        border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; outline: none;
      }
      input[type="text"]:focus { border-color: var(--accent); }

      /* 전체 화면을 덮는 상태 오버레이(연결 끊김·사망·라운드 종료). */
      .screen {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: rgba(6, 8, 12, .72); pointer-events: auto; text-align: center;
        /* 대기실은 코드·목록·설정이 다 들어가 화면보다 길어질 수 있다.
           잘려서 '시작하기'가 사라지면 방을 시작할 방법이 없어진다. */
        overflow-y: auto; padding: 20px 0;
      }
      .screen.soft { background: rgba(6, 8, 12, .45); }
      .screen h1 { margin: 0; font-size: 34px; letter-spacing: -.5px; }
      /* 부제는 게임이 뭔지 설명하는 유일한 문장이다. 작게 쓰면 아무도 안 읽는다. */
      .screen > .muted { font-size: 15px; max-width: 680px; }
      .screen h2 { margin: 0; font-size: 20px; font-weight: 600; }

      /* 순위표. 상시(우상단)와 라운드 종료 화면이 같은 표를 크기만 달리 쓴다. */
      .standings-box { display: flex; flex-direction: column; gap: 6px; }
      .standings-title { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
      table.standings { border-collapse: collapse; font-size: 13px; white-space: nowrap; }
      table.standings.full { font-size: 17px; width: 100%; }
      table.standings th {
        color: var(--muted); font-weight: 500; font-size: 12px;
        padding: 2px 9px; text-align: left; border-bottom: 1px solid var(--line);
      }
      table.standings.full th { font-size: 14px; padding: 4px 14px 8px; }
      table.standings td { padding: 4px 9px; text-align: left; }
      table.standings.full td { padding: 8px 14px; }
      table.standings th.num, table.standings td.num { text-align: right; font-variant-numeric: tabular-nums; }
      table.standings td.rank { color: var(--muted); text-align: center; padding-right: 2px; }
      table.standings .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }
      /* 매치 포인트에 걸린 줄. 이번 라운드가 마지막일 수 있다는 뜻이라 눈에 띄어야 한다. */
      table.standings tr.srow td.hot { color: #fbbf24; font-weight: 700; }
      tr.srow.lead td.rank { color: #fbbf24; }
      tr.srow.me td { color: var(--accent); font-weight: 600; background: rgba(79, 209, 197, .12); }
      tr.srow.down td { opacity: .45; }
      tr.srow + tr.srow td { border-top: 1px solid rgba(255,255,255,.05); }

      /* 라운드·매치 종료. 뒤에서 판이 계속 돌고 있으므로 판 하나만 얹는다. */
      .result-card {
        padding: 26px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px;
        background: rgba(10, 13, 19, .9); min-width: min(92vw, 560px); max-width: min(94vw, 860px);
        max-height: 88vh; overflow-y: auto;
      }
      .result-title { font-size: 52px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
      .result-title.win { color: #fbbf24; text-shadow: 0 0 22px rgba(251,191,36,.45); }
      .result-title.draw { color: var(--muted); }
      .result-reason { font-size: 18px; color: var(--accent); }
      .result-clock { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--muted); }
      .result-clock.urgent { color: #fbbf24; font-weight: 700; }

      table.list { border-collapse: collapse; font-size: 12px; }
      table.list th, table.list td { padding: 3px 8px; text-align: left; white-space: nowrap; }
      table.list th { color: var(--muted); font-weight: 500; }
      table.list td.num { text-align: right; font-variant-numeric: tabular-nums; }
      tr.dead td { opacity: .45; }
      tr.you td { color: var(--accent); }

      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        display: flex; align-items: center; gap: 7px;
        border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
        background: #141924; min-width: 132px;
      }
      .chip.off { opacity: .4; }
      .chip .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
      .chip .key { color: var(--muted); font-size: 11px; }
      .chip .cost { color: var(--muted); font-size: 11px; margin-left: auto; }

      /* 메뉴: 한 화면에 결정 하나. 카드 안에 활성 단계 하나만 보인다.
         크기는 취향이 아니라 요구사항이다 — 우표만 한 카드에 11px 글씨를 넣으면
         선택지가 무슨 뜻인지 읽기 전에 포기한다. */
      .menu-card {
        width: min(92vw, 760px);
        min-width: min(92vw, 560px);
        padding: 26px 30px;
        display: flex; flex-direction: column; align-items: stretch; gap: 18px;
        font-size: 15px;
      }
      .menu-step, .menu-col { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
      .menu-col { gap: 12px; }
      /* 대기실은 넣을 것이 많다. 간격만 줄여도 한 화면에 들어온다. */
      .menu-step.lobby { gap: 11px; }
      .menu-card .hint { font-size: 13px; color: var(--muted); line-height: 1.6; }
      .menu-card .lead { font-size: 15px; line-height: 1.6; }
      .center { text-align: center; }

      /* 단계 머리: 뒤로(좌) + 제목(중앙)이 어느 단계에서나 같은 자리에 있어야 한다. */
      .step-head { display: grid; grid-template-columns: 110px 1fr 110px; align-items: center; gap: 8px; }
      .step-title { font-size: 22px; font-weight: 700; text-align: center; }
      .step-head .btn-back { justify-self: start; }

      .menu-card button {
        min-height: 44px; padding: 0 20px; font-size: 15px; border-radius: 8px;
      }
      .menu-card button.primary { min-width: 160px; font-size: 16px; font-weight: 600; }
      .menu-card .row { display: flex; gap: 12px; align-items: center; }
      .menu-card .row.center { justify-content: center; }

      /* 큰 선택 카드. 제목 + 설명 두 줄이 들어가야 "뭐가 다른지"가 화면에 남는다. */
      .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(240px, 1fr)); gap: 14px; }
      @media (max-width: 640px) { .choice-grid { grid-template-columns: 1fr; } }
      .menu-card button.choice {
        min-height: 110px; padding: 16px 40px 16px 18px;
        display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
        gap: 6px; text-align: left; position: relative;
        background: #141a26; border: 2px solid var(--line); border-radius: 10px;
      }
      .menu-card button.choice:hover:not(:disabled) { background: #1b2331; border-color: #44506a; }
      .choice .ct { font-size: 18px; font-weight: 700; }
      .choice .cd { font-size: 13px; color: var(--muted); line-height: 1.55; }
      /* 선택 표시는 은은한 채우기로는 안 보인다. 테두리 + 체크를 같이 쓴다. */
      .menu-card button.choice.on { border-color: var(--accent); background: #14242a; }
      .choice.on::after {
        content: "✓"; position: absolute; top: 10px; right: 14px;
        color: var(--accent); font-size: 20px; font-weight: 700;
      }

      /* 방 코드는 옆자리 사람이 받아 적는 물건이다. 이 화면에서 제일 커야 한다. */
      .roomcode {
        font-size: 72px; font-weight: 700; letter-spacing: 16px; text-indent: 16px;
        color: #fff; line-height: 1.1; text-align: center;
      }
      .share-row {
        display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
      }
      .share-url {
        font-size: 14px; color: var(--muted); background: #0f131b;
        border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px;
        max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .notice { color: var(--danger); font-size: 14px; }

      .menu-card input[type="text"] { font-size: 18px; padding: 12px 14px; min-height: 48px; }
      input.name-input { width: 100%; }
      .menu-card input.code-input {
        font-size: 44px; letter-spacing: 18px; text-align: center; text-indent: 18px;
        width: 300px; min-height: 76px; text-transform: uppercase;
      }
      .stepper button { min-width: 56px; font-size: 22px; font-weight: 700; }
      .stepper .val { font-size: 17px; font-weight: 600; min-width: 130px; text-align: center; }

      /* 참가자 목록. 배지로 역할을, 오른쪽 열로 준비 상태를 읽는다. */
      table.roster { width: 100%; border-collapse: collapse; font-size: 15px; }
      table.roster td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
      table.roster td.status { text-align: right; white-space: nowrap; }
      table.roster tr.me td { background: rgba(79, 209, 197, .1); }
      .badge {
        display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 999px;
        margin-left: 7px; border: 1px solid var(--line); color: var(--muted);
      }
      .badge.me { color: var(--accent); border-color: #2c9a90; }
      .badge.host { color: #fbbf24; border-color: #7a5c14; }
      .ready-yes { color: var(--ok); }
      .copied-flag { color: var(--ok); font-size: 14px; }
      /* 접속자 목록에서 내 줄. 화면 속 표식과 같은 말을 해야 한다. */
      tr.you td { color: var(--accent); font-weight: 600; background: rgba(79, 209, 197, .1); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
